<!doctype html>
<html lang="en" class="h-full scheme-light-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Helpdesk</title>
    <script>
      // shadcn keys its dark tokens off a `.dark` class, but this app has no
      // theme switcher — so mirror the OS preference onto <html>. Inline in
      // <head> so it lands before first paint instead of flashing light first.
      (() => {
        const query = window.matchMedia("(prefers-color-scheme: dark)");
        const apply = () =>
          document.documentElement.classList.toggle("dark", query.matches);
        apply();
        query.addEventListener("change", apply);
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
